######################### Spide Standalone Configuration #########################

######################### Proxy & DNS — tương tự InternetIncome #################

# Đọc toàn bộ proxy từ proxies.txt; mỗi dòng tạo một TUN riêng.
USE_PROXIES=true

# Hỗ trợ: http://, https://, socks4:// và socks5://.
# Bật khi SOCKS5 provider hỗ trợ DNS qua proxy.
USE_SOCKS5_DNS=false

# Giữ true giống cấu hình InternetIncome của bạn.
# TUN2Proxy thực thi DNS qua TCP trong đường TUN/proxy để tránh DNS UDP direct.
USE_DNS_OVER_HTTPS=true

# 0 = chạy toàn bộ proxies.txt; đặt 5 để thử 5 proxy đầu.
SPIDE_MAX_INSTANCES=0

# Kiểm tra public egress và bỏ proxy trùng IP trước khi tạo Spide.
SPIDE_VALIDATE_EGRESS=true
SPIDE_SKIP_DUPLICATE_EGRESS=true

# auto = tự chia theo RAM máy, hoàn toàn độc lập setup_vps/setup_vm cũ.
SPIDE_MAX_MEMORY=auto
SPIDE_MEMORY_RESERVATION=auto
SPIDE_MEMORY_SWAP=auto
SPIDE_CPU=auto

TUN_MAX_MEMORY=auto
TUN_MEMORY_SWAP=auto
TUN_CPU=auto

# Độ trễ giữa các peer.
START_DELAY=1
