cat << 'EOF' > ~/properties.conf
######################### Spide Standalone Configuration #########################

# Tên device xuất ra file key. auto = lấy tên folder hiện tại.
DEVICE_PREFIX=auto

# Thời gian chờ kiểm tra sau lệnh --deploy.
DEPLOY_WAIT=20

######################### Che do chay (DA BAT PROXY TU DONG) #####################
# USE_PROXIES=true  -> Chế độ PROXY: đọc proxies.txt, mỗi dòng = 1 TUN + 1 peer
USE_PROXIES=true

# 0 = Chạy toàn bộ proxy có trong proxies.txt; N = Chỉ chạy N proxy đầu tiên
SPIDE_MAX_INSTANCES=0

######################### Cau hinh TUN & DNS chong Drop UDP ######################
# Ho tro: http://, https://, socks4://, socks5://
USE_SOCKS5_DNS=false

# Bat DoH/TCP DNS de tranh tuyet doi loi Drop UDP Port 53 tren Proxy
USE_DNS_OVER_HTTPS=true

# Khong goi dich vu ngoai check IP
SPIDE_VALIDATE_EGRESS=false

# Bo qua proxy trung lap
SPIDE_SKIP_DUPLICATE_EGRESS=true

# Tu dong can chinh RAM theo cau hinh may
TUN_MAX_MEMORY=auto
TUN_MEMORY_SWAP=auto
TUN_CPU=auto
TUN_MTU=1400
TUN_TCP_MSS=1360
TUN_TCP_TIMEOUT=300
TUN_VERBOSITY=warn

######################### Spide peer #############################################
SPIDE_MAX_MEMORY=auto
SPIDE_MEMORY_RESERVATION=auto
SPIDE_MEMORY_SWAP=auto
SPIDE_CPU=auto

# Do tre khoi dong giua cac peer
START_DELAY=1
EOF