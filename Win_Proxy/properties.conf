######################### Win_Proxy — Windows-box (Wine) Configuration #########################
#  Mỗi dòng proxies.txt = 1 container TUN (tun2proxy) + 1 container "Windows" (Wine+Xvfb).
#  Mọi danh tính máy (MachineGuid, tên máy, BIOS/OEM, MAC, timezone, locale) được sinh
#  tự động & KHỚP VỚI PROXY (1 proxy = 1 danh tính ổn định). Không cần chỉnh tay.
#
#  QUY TẮC GIÁ TRỊ: email/password/đường dẫn chứa ký tự đặc biệt -> bọc trong nháy đơn ''.
#############################################################################################

# ==================== TỔNG QUÁT ====================
# Tên nhãn cho device (chỉ dùng trong tên container/status, không phải tên máy Windows)
DEVICE_PREFIX=winbox

# Image Windows-box (build bằng: sudo bash winIncome.sh --build)
WIN_IMAGE=winproxy/windows-box:1.0

# Bật VNC ảo (x11vnc) để LOGIN APP LẦN ĐẦU. Login xong có thể tắt để tiết kiệm RAM.
# Cổng VNC = 5900 + (số thứ tự proxy). Truy cập qua SSH tunnel: ssh -L 5901:127.0.0.1:5901 user@vps
WIN_VNC=false

# Độ phân giải desktop ảo (16-bit = nhẹ hơn 24-bit, vẫn đủ cho app tray/login)
WIN_SCREEN=1280x720x16

# ==================== APP WINDOWS-ONLY (nền tảng) ====================
# Danh sách app chạy trong MỖI container (phân tách dấu phẩy). Key viết HOA.
# Bỏ app nào ra khỏi danh sách = tắt app đó.
WIN_APPS=PASSIVEAPP,BYTEBENEFIT,TREES

# <KEY>_INSTALLER = tên file sẽ lưu/lấy trong installers/
# <KEY>_URL       = link tải CHÍNH THỨC (dùng bởi: sudo bash winIncome.sh --fetch)
# <KEY>_LAUNCH    = đường dẫn exe SAU KHI CÀI. Để "auto" + <KEY>_DETECT để TỰ TÌM
#                   (khuyên dùng — khỏi phải đối chiếu tay).
# <KEY>_DETECT    = mẫu tên file để tự dò exe (vd: PassiveApp*.exe)
# <KEY>_INSTALL_FLAGS = /S (NSIS) hoặc /VERYSILENT (Inno). Để trống = cài tay qua VNC.
# <KEY>_ARGS      = đối số chạy app; <KEY>_CWD = thư mục làm việc (tùy chọn).

# --- PassiveApp (https://www.passiveapp.com/internet-sharing) ---
PASSIVEAPP_INSTALLER=PassiveApp-Setup.exe
PASSIVEAPP_URL=https://cdn.passiveapp.com/passiveapp/desktop-app/PassiveApp%20Desktop%20Setup%201.0.15%20x64.exe
PASSIVEAPP_LAUNCH=auto
PASSIVEAPP_DETECT=PassiveApp*.exe
PASSIVEAPP_INSTALL_FLAGS=/S
PASSIVEAPP_ARGS=

# --- ByteBenefit (https://dashboard.bytebenefit.io) ---
BYTEBENEFIT_INSTALLER=ByteBenefit-Setup.exe
BYTEBENEFIT_URL=https://app.bytebenefit.io/ByteBenefit_Setup
BYTEBENEFIT_LAUNCH=auto
BYTEBENEFIT_DETECT=ByteBenefit*.exe
BYTEBENEFIT_INSTALL_FLAGS=/S
BYTEBENEFIT_ARGS=

# --- Trees App (https://dashboard.trees.app) ---
TREES_INSTALLER=Trees-App-Setup.exe
TREES_URL=https://downloads.trees.app/trees/latest/Trees-App-Setup.exe
TREES_LAUNCH=auto
TREES_DETECT=Trees*.exe
TREES_INSTALL_FLAGS=/S
TREES_ARGS=

# Thêm platform mới trong tương lai: thêm KEY vào WIN_APPS rồi khai báo
#   <KEY>_INSTALLER / <KEY>_URL / <KEY>_LAUNCH(=auto) / <KEY>_DETECT
#   / <KEY>_INSTALL_FLAGS / <KEY>_ARGS — không cần sửa script.

# ==================== AUTO-LOGIN (tùy chọn — giúp "ít thao tác nhất") ====================
# Điền email/password -> script tự đăng nhập bằng xdotool sau khi cài app,
# chụp ảnh xác minh vào instances/<hash>/prefix/apps/<KEY>.png.
# BỎ TRỐNG nếu muốn login tay qua VNC (WIN_VNC=true).
#
# <KEY>_LOGIN_EMAIL / <KEY>_LOGIN_PASSWORD : tài khoản đăng nhập.
# <KEY>_WIN_TITLE   : tựa cửa sổ app (để xdotool tìm đúng cửa sổ). Bỏ trống = tự lấy cửa sổ đầu.
# <KEY>_LOGIN_SCRIPT: (tùy chọn) kịch bản phím riêng, phân tách bằng ';':
#     type:<chuỗi> | key:<phím> | sleep:<giây> | click | click:<x>,<y>
#     Mặc định (để trống): gõ email -> Tab -> gõ password -> Enter.
PASSIVEAPP_LOGIN_EMAIL=
PASSIVEAPP_LOGIN_PASSWORD=
PASSIVEAPP_WIN_TITLE=Passive App
PASSIVEAPP_LOGIN_SCRIPT=
# (tùy chọn) từ khóa online/error riêng cho app này (ghi đè LOG_ONLINE/LOG_ERROR toàn cục)
#PASSIVEAPP_LOG_ONLINE=
#PASSIVEAPP_LOG_ERROR=

BYTEBENEFIT_LOGIN_EMAIL=
BYTEBENEFIT_LOGIN_PASSWORD=
BYTEBENEFIT_WIN_TITLE=ByteBenefit
BYTEBENEFIT_LOGIN_SCRIPT=

TREES_LOGIN_EMAIL=
TREES_LOGIN_PASSWORD=
TREES_WIN_TITLE=Trees
TREES_LOGIN_SCRIPT=

# ==================== PROXY ENGINE (giống List_Proxy / Spide) ====================
USE_PROXIES=true

# DNS: DoH/TCP trong TUN (chống drop UDP 53, chống lệch GeoIP). KHÔNG dùng SOCKS5-DNS.
USE_SOCKS5_DNS=false
USE_DNS_OVER_HTTPS=true

# TẮT probe trước khi chạy để bảo vệ proxy IP-auth tuyệt đối.
VALIDATE_PROXIES=false

# Ảnh TUN (pin version = ổn định). Hỗ trợ http/https/socks4/socks5.
TUN_IMAGE=ghcr.io/tun2proxy/tun2proxy:v0.8.3

TUN_MTU=1400
TUN_TCP_MSS=1360
TUN_TCP_TIMEOUT=300
TUN_VERBOSITY=warn

# ==================== TÀI NGUYÊN (auto = tự cân theo RAM VPS) ====================
# Không đặt giới hạn cứng trừ khi đã đo kỹ. auto giúp VPS chạy nhiều container nhất.
TUN_MAX_MEMORY=auto
TUN_MEMORY_SWAP=auto
TUN_CPU=auto
WIN_MAX_MEMORY=auto
WIN_MEMORY_RESERVATION=auto
WIN_MEMORY_SWAP=auto
WIN_CPU=auto

# Dung lượng tmpfs /winehome (HOME của wine, TEMP, cache...) — nhỏ gọn, ép vào RAM/ZRAM
WIN_TMPFS=128m

# Độ trễ giữa 2 container lúc khởi động hàng loạt (tránh sốc RAM/CPU)
DELAY_BETWEEN_CONTAINER=2

# ==================== IP VPS & PROXY IP-AUTH (CỰC KỲ QUAN TRỌNG) ====================
# Proxy của bạn dạng user:pass NHƯNG bản chất vẫn là IP-Authentication (whitelist IP nguồn).
# Vì vậy TẤT CẢ proxy đều check bằng CHÍNH IP VPS — KHÔNG gọi bất kỳ request nào QUA proxy.
# Mọi kết nối TỚI proxy đi ra từ IP VPS -> IP này PHẢI được whitelist trong dashboard proxy.
#   --myip       : xem IP VPS (tự dò, cache 24h, direct không qua proxy).
#   --checkproxy : kiểm tra từng proxy (TCP + bắt tay auth) — KHÔNG gọi qua proxy.
# VPS_IP=<ip> : gán cứng nếu VPS bị chặn endpoint dò IP (hoặc dùng nhiều NIC — phải gán đúng IP egress).
VPS_IP=

# ==================== IDENTITY / GEO ====================
# Tra cứu geo của proxy IP PHÍA HOST (direct, KHÔNG qua proxy) để set timezone/locale khớp.
# Tắt nếu VPS bị chặn ip-api.com. Có thể ghi hint trực tiếp trong proxies.txt: #CC:City:TZ
ALLOW_GEO_LOOKUP=true

# Font MS thật (Arial/Times New Roman...) khi build image -> canvas fingerprint sát hơn.
# 1 = bật (mặc định) · 0 = tắt (image nhẹ hơn ~50-60MB).
MSFONTS=1

# ==================== LOG THÔNG MINH (online/earning + chống nghẽn ổ) ====================
# Mỗi app ghi log riêng vào instances/<hash>/prefix/apps/logs/<KEY>.log.
# - Giữ tối đa N ngày rồi TỰ XÓA (3-5 ngày là hợp lý; không phình disk).
# - Mỗi file tối đa N KB, vượt là xoay giữ 1 bản .log.1; dòng quá dài bị cắt.
# - --health  : tự đọc log, đánh giá ONLINE/ERROR/IDLE từng app (KHÔNG gọi qua proxy).
# - --cleanlogs: xóa thủ công log/ảnh cũ hơn N ngày (an toàn, thêm 1 lớp dọn).
WIN_LOG_RETENTION_DAYS=4
WIN_LOG_MAX_KB=2048
WIN_LOG_LOOKBACK_MIN=60
WIN_LOG_MAX_LINE=400

# Từ khóa (regex ERE, phân tách |) để --health nhận diện trạng thái.
# Có thể override riêng từng app bằng <KEY>_LOG_ONLINE / <KEY>_LOG_ERROR.
LOG_ONLINE=online|earning|connected|active|success|started|synced|ready|logged in|mining|traffic|balance|paid|reward
LOG_ERROR=error|failed|refus|timeout|unauthor|offline|disconnect|block|ban|denied|unreachable|expired|dead|502|503|500|401|403|reset

# ==================== MẠNG / LEAK-PROOF (đường truyền) ====================
# DNS của app được pin đi qua TUN/proxy (KHÔNG lộ query ra DNS VPS). Để trống = dùng mặc định 8.8.8.8,1.1.1.1.
WIN_DNS_SERVERS=8.8.8.8,1.1.1.1

# Đặt hostname máy (Linux) = tên máy Windows cho realism. Cần --cap-add SYS_ADMIN (chỉ để
# sethostname). false = sandbox chặt hơn (hostname = container-id; KHÔNG ảnh hưởng leak,
# vì danh tính Windows nằm trong registry identity.reg).
WIN_SET_HOSTNAME=true

# Không tự update image (giữ pin version để ổn định tuyệt đối)
AUTO_UPDATE_CONTAINERS=false
