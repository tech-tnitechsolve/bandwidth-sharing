######################### InternetIncome TEST — KHỚP 4 SETUP HOST #########################
# Giữ nguyên token/email của bạn. Toàn bộ thông số Mạng/DNS/Hiệu năng đã được chuẩn hóa.
# Host (setup_vps / setup_vm / setup_oracle_cloud / setup_oracle_ARM64) quản lý:
#   ZRAM ZSTD, sysctl BBR, resolv.conf DIRECT, FlapGuard, Autosync Memory, Cron bảo trì.
# File này KHÔNG ĐƯỢC: Bật SOCKS5 DNS, Docker Embedded DNS, giới hạn cứng CPU/RAM, Watchtower.
# DNS App = DoH + DNS Cache TRONG TUN. DNS Host = 1.1.1.1 (Direct Upstream).
###########################################################################################

DEVICE_NAME='ubuntu'

REPOCKET_EMAIL=
REPOCKET_API=

TRAFFMONETIZER_TOKEN=

EARN_FM_API=
USE_EARN_FM_FLEETSHARE=false

PROXYRACK_API=
PROXYBASE_ACCOUNT_ID=

IPROYALS_EMAIL=
IPROYALS_PASSWORD=

HONEYGAIN_EMAIL=
HONEYGAIN_PASSWORD=
HONEYGAIN_POT=false

ANTGAIN_API_KEY=

PACKETSTREAM_CID=

EARNAPP=false
USE_EARNAPP_PRIVILEGED=false

BITPING_EMAIL=
BITPING_PASSWORD=

PACKETSHARE_EMAIL=
PACKETSHARE_PASSWORD=

WIPTER_EMAIL=
WIPTER_PASSWORD=

######################### Auto Update (Host tự quản lý) #########################
# Script setup Host đã tự gỡ Watchtower & có Cron prune image định kỳ.
AUTO_UPDATE_CONTAINERS=false

######################### Network — DUY NHẤT 1 CHẾ ĐỘ: PROXY #########################
# Tuyệt đối không bật cùng lúc direct / vpn / multi-ip khi đang chạy Proxy.
USE_DIRECT_CONNECTION=false
USE_PROXIES=true
USE_VPNS=false
USE_MULTI_IP=false

# BẮT BUỘC TẮT: Không dựa vào SOCKS5 DNS (tránh crash khi gặp HTTP proxy & proxy thiếu UDP).
USE_SOCKS5_DNS=false

# BẬT TUN2PROXY: Engine đa năng chạy mượt cả HTTP CONNECT lẫn SOCKS5.
USE_TUN2PROXY=true

# BẮT BUỘC TẮT USE_DNS_OVER_HTTPS: 
# Đặt false để tun2proxy tự động kích hoạt chế độ "Virtual DNS (Fake-IP)".
# Cơ chế này triệt tiêu hoàn toàn truy vấn Port 53 -> Cứu sống 100% proxy bị chặn Port 53 (2proxy, Proxyware...).
USE_DNS_OVER_HTTPS=false
USE_DNSCRYPT=false
USE_DNS_CACHE=false

# Không dùng Docker Embedded DNS (127.0.0.11) để tránh làm đè đường định tuyến TUN.
USE_DOCKER_EMBEDDED_DNS=false

# Không bật Custom Network (Chỉ dùng khi chạy trên 1000 proxy và tự tune kernel riêng).
USE_CUSTOM_NETWORK=false

######################### Performance & IP-Auth Hardening #########################
ENABLE_LOGS=false
USE_DOCKER_INIT=false

# Độ trễ khởi tạo giữa các container (Giúp tránh nghẽn CPU lúc vừa start).
DELAY_BETWEEN_CONTAINER=1

# TẮT kiểm tra probe qua Proxy để bảo vệ tuyệt đối cho Proxy dạng IP-Authentication.
VALIDATE_PROXIES=false

# GIỮ NGUYÊN COMMENT: Tuyệt đối không đặt giới hạn cứng để ii-autosync tự điều phối RAM động.
#MAX_MEMORY=1024m
#MEMORY_RESERVATION=
#MEMORY_SWAP=
#CPU=1